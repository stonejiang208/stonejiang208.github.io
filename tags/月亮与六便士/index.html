<script>
(function() {
  'use strict';

  // 配置 - 支持开发和生产环境
  const CONFIG = {
    // 开发环境配置（本地测试）
    development: {
      performanceEndpoint: 'http://localhost:3001',
      analyticsEndpoint: 'http://localhost:3002/analytics',
      sampleRate: 1.0, // 100%采样率用于测试
      debug: true
    },
    // 生产环境配置（Railway部署）
    production: {
      performanceEndpoint: 'https://blog-performance-monitor.up.railway.app',
      analyticsEndpoint: 'https://blog-analytics-server.up.railway.app/analytics',
      sampleRate: 0.1, // 10%采样率
      debug: false
    },
    // 通用配置
    maxMetricsPerSession: 50,
    sessionTimeout: 30 * 60 * 1000, // 30分钟
    localStorageKey: 'performance_metrics_buffer',
    analyticsLocalStorageKey: 'analytics_events_buffer'
  };

  // 根据当前环境选择配置
  const isDevelopment = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
  const currentConfig = isDevelopment ? CONFIG.development : CONFIG.production;

  // 性能指标收集器
  class PerformanceMonitor {
    constructor() {
      this.metricsBuffer = [];
      this.sessionId = this.generateSessionId();
      this.pageLoadTime = Date.now();
      this.init();
    }

    generateSessionId() {
      return 'session_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
    }

    init() {
      if (Math.random() > currentConfig.sampleRate) return;

      this.collectInitialMetrics();
      this.setupEventListeners();
      this.setupPeriodicSend();
      
      window.addEventListener('beforeunload', () => this.sendMetrics());
    }

    collectInitialMetrics() {
      const metrics = {
        type: 'page_load',
        timestamp: Date.now(),
        sessionId: this.sessionId,
        url: window.location.href,
        referrer: document.referrer,
        userAgent: navigator.userAgent,
        platform: navigator.platform,
        language: navigator.language,
        screenResolution: `${window.screen.width}x${window.screen.height}`,
        viewportSize: `${window.innerWidth}x${window.innerHeight}`,
        connection: this.getConnectionInfo(),
        deviceMemory: navigator.deviceMemory || 'unknown',
        hardwareConcurrency: navigator.hardwareConcurrency || 'unknown',
        performance: this.getPerformanceMetrics(),
        mathjax: this.detectMathJax(),
        pageLoadTime: Date.now() - this.pageLoadTime
      };

      this.addToBuffer(metrics);
    }

    getConnectionInfo() {
      const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (!connection) return 'unknown';
      
      return {
        effectiveType: connection.effectiveType,
        downlink: connection.downlink,
        rtt: connection.rtt,
        saveData: connection.saveData
      };
    }

    getPerformanceMetrics() {
      if (!window.performance || !window.performance.timing) return null;

      const timing = window.performance.timing;
      const navigation = window.performance.navigation || {};
      
      return {
        navigationType: navigation.type || 0,
        redirectCount: navigation.redirectCount || 0,
        dnsLookup: timing.domainLookupEnd - timing.domainLookupStart,
        tcpConnect: timing.connectEnd - timing.connectStart,
        requestResponse: timing.responseEnd - timing.requestStart,
        domInteractive: timing.domInteractive - timing.navigationStart,
        domComplete: timing.domComplete - timing.navigationStart,
        loadEvent: timing.loadEventEnd - timing.navigationStart,
        firstPaint: this.getFirstPaint(),
        firstContentfulPaint: this.getFirstContentfulPaint(),
        largestContentfulPaint: this.getLargestContentfulPaint(),
        cumulativeLayoutShift: this.getCumulativeLayoutShift()
      };
    }

    getFirstPaint() {
      const entries = performance.getEntriesByType('paint');
      const fpEntry = entries.find(entry => entry.name === 'first-paint');
      return fpEntry ? Math.round(fpEntry.startTime) : null;
    }

    getFirstContentfulPaint() {
      const entries = performance.getEntriesByType('paint');
      const fcpEntry = entries.find(entry => entry.name === 'first-contentful-paint');
      return fcpEntry ? Math.round(fcpEntry.startTime) : null;
    }

    getLargestContentfulPaint() {
      const entries = performance.getEntriesByType('largest-contentful-paint');
      if (entries.length === 0) return null;
      
      const lcpEntry = entries[entries.length - 1];
      return Math.round(lcpEntry.startTime);
    }

    getCumulativeLayoutShift() {
      let cls = 0;
      const observer = new PerformanceObserver((list) => {
        for (const entry of list.getEntries()) {
          if (!entry.hadRecentInput) {
            cls += entry.value;
          }
        }
      });
      
      try {
        observer.observe({ type: 'layout-shift', buffered: true });
        return Math.round(cls * 100) / 100;
      } catch (e) {
        return null;
      }
    }

    detectMathJax() {
      const scripts = Array.from(document.querySelectorAll('script'));
      const hasMathJaxScript = scripts.some(script => 
        script.src && script.src.includes('mathjax')
      );
      
      const hasMathJaxElements = document.querySelectorAll('[class*="math"], [class*="MathJax"]').length > 0;
      
      return {
        hasScript: hasMathJaxScript,
        hasElements: hasMathJaxElements,
        elementCount: document.querySelectorAll('[class*="math"], [class*="MathJax"]').length
      };
    }

    setupEventListeners() {
      window.addEventListener('error', (event) => {
        if (event.target && event.target.tagName) {
          this.collectResourceError(event);
        }
      }, true);

      this.setupMathJaxMonitoring();
      this.setupUserInteractionMonitoring();
      this.setupNetworkMonitoring();
    }

    collectResourceError(event) {
      const metrics = {
        type: 'resource_error',
        timestamp: Date.now(),
        sessionId: this.sessionId,
        url: window.location.href,
        errorType: 'resource_load',
        resourceType: event.target.tagName.toLowerCase(),
        resourceSrc: event.target.src || event.target.href || 'unknown',
        errorMessage: event.message || 'Resource load failed'
      };

      this.addToBuffer(metrics);
    }

    setupMathJaxMonitoring() {
      if (window.MathJax && window.MathJax.Hub) {
        window.MathJax.Hub.Register.StartupHook('End', () => {
          const metrics = {
            type: 'mathjax_rendered',
            timestamp: Date.now(),
            sessionId: this.sessionId,
            url: window.location.href,
            renderTime: Date.now() - this.pageLoadTime,
            mathElementCount: document.querySelectorAll('.MathJax, .math').length
          };

          this.addToBuffer(metrics);
        });
      }

      document.addEventListener('click', (event) => {
        const target = event.target;
        if (target.classList && (target.classList.contains('MathJax') || target.classList.contains('math'))) {
          const metrics = {
            type: 'math_element_click',
            timestamp: Date.now(),
            sessionId: this.sessionId,
            url: window.location.href,
            elementType: target.tagName,
            elementClass: target.className
          };

          this.addToBuffer(metrics);
        }
      });
    }

    setupUserInteractionMonitoring() {
      let scrollStartTime = null;
      let scrollTimeout = null;

      window.addEventListener('scroll', () => {
        if (!scrollStartTime) scrollStartTime = Date.now();
        
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(() => {
          if (scrollStartTime) {
            const scrollDuration = Date.now() - scrollStartTime;
            const metrics = {
              type: 'scroll_session',
              timestamp: Date.now(),
              sessionId: this.sessionId,
              url: window.location.href,
              duration: scrollDuration,
              scrollY: window.scrollY,
              viewportHeight: window.innerHeight,
              documentHeight: document.documentElement.scrollHeight
            };

            this.addToBuffer(metrics);
            scrollStartTime = null;
          }
        }, 1000);
      });

      document.addEventListener('click', (event) => {
        if (Math.random() < 0.01) {
          const metrics = {
            type: 'user_click',
            timestamp: Date.now(),
            sessionId: this.sessionId,
            url: window.location.href,
            targetTag: event.target.tagName,
            targetClass: event.target.className,
            targetId: event.target.id,
            x: event.clientX,
            y: event.clientY
          };

          this.addToBuffer(metrics);
        }
      });
    }

    setupNetworkMonitoring() {
      const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (!connection) return;

      connection.addEventListener('change', () => {
        const metrics = {
          type: 'network_change',
          timestamp: Date.now(),
          sessionId: this.sessionId,
          url: window.location.href,
          connection: this.getConnectionInfo()
        };

        this.addToBuffer(metrics);
      });
    }

    setupPeriodicSend() {
      setInterval(() => {
        if (this.metricsBuffer.length >= 10) this.sendMetrics();
      }, 30000);

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') this.sendMetrics();
      });
    }

    addToBuffer(metrics) {
      this.metricsBuffer.push(metrics);
      
      if (this.metricsBuffer.length > CONFIG.maxMetricsPerSession) {
        this.metricsBuffer = this.metricsBuffer.slice(-CONFIG.maxMetricsPerSession);
      }
      
      this.saveToLocalStorage();
    }

    saveToLocalStorage() {
      try {
        const data = {
          sessionId: this.sessionId,
          metrics: this.metricsBuffer,
          timestamp: Date.now()
        };
        localStorage.setItem(CONFIG.localStorageKey, JSON.stringify(data));
      } catch (e) {
        console.warn('无法保存性能数据到 localStorage:', e.message);
      }
    }

    loadFromLocalStorage() {
      try {
        const data = localStorage.getItem(CONFIG.localStorageKey);
        if (data) {
          const parsed = JSON.parse(data);
          if (Date.now() - parsed.timestamp < CONFIG.sessionTimeout) {
            this.sessionId = parsed.sessionId;
            this.metricsBuffer = parsed.metrics || [];
          } else {
            localStorage.removeItem(CONFIG.localStorageKey);
          }
        }
      } catch (e) {}
    }

    sendMetrics() {
      if (this.metricsBuffer.length === 0) return;

      const dataToSend = [...this.metricsBuffer];
      this.metricsBuffer = [];

      if (navigator.sendBeacon) {
        const blob = new Blob([JSON.stringify(dataToSend)], { type: 'application/json' });
        navigator.sendBeacon(currentConfig.performanceEndpoint, blob);
      } else {
        fetch(currentConfig.performanceEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dataToSend),
          keepalive: true
        }).catch(error => {
          console.warn('性能数据发送失败:', error);
          this.metricsBuffer = [...dataToSend, ...this.metricsBuffer];
        });
      }

      try {
        localStorage.removeItem(CONFIG.localStorageKey);
      } catch (e) {}
    }

    getMobileSpecificMetrics() {
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
      
      return {
        isMobile,
        isTouchDevice,
        devicePixelRatio: window.devicePixelRatio || 1,
        orientation: window.screen.orientation ? window.screen.orientation.type : 'unknown',
        battery: this.getBatteryInfo()
      };
    }

    async getBatteryInfo() {
      if (!navigator.getBattery) return null;
      
      try {
        const battery = await navigator.getBattery();
        return {
          charging: battery.charging,
          level: battery.level,
          chargingTime: battery.chargingTime,
          dischargingTime: battery.dischargingTime
        };
      } catch (e) {
        return null;
      }
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      window.performanceMonitor = new PerformanceMonitor();
    });
  } else {
    window.performanceMonitor = new PerformanceMonitor();
  }

})();
</script>


<script>
(function() {
  'use strict';

  // 分析配置 - 使用主配置的环境判断
  const ANALYTICS_CONFIG = {
    endpoint: currentConfig.analyticsEndpoint,
    localStorageKey: CONFIG.analyticsLocalStorageKey,
    sessionTimeout: CONFIG.sessionTimeout,
    pageViewSampleRate: isDevelopment ? 1.0 : 0.5, // 开发环境100%，生产环境50%
    eventSampleRate: isDevelopment ? 0.5 : 0.1 // 开发环境50%，生产环境10%
  };

  class AnalyticsCollector {
    constructor() {
      this.sessionId = this.generateSessionId();
      this.pageViewId = this.generatePageViewId();
      this.sessionStart = Date.now();
      this.pageViewStart = Date.now();
      this.init();
    }

    generateSessionId() {
      return 'sess_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
    }

    generatePageViewId() {
      return 'page_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
    }

    init() {
      this.collectPageView();
      this.setupEventListeners();
      this.setupPeriodicFlush();
      
      window.addEventListener('beforeunload', () => this.flushData());
    }

    collectPageView() {
      if (Math.random() > ANALYTICS_CONFIG.pageViewSampleRate) return;

      const pageView = {
        type: 'pageview',
        timestamp: Date.now(),
        sessionId: this.sessionId,
        pageViewId: this.pageViewId,
        url: window.location.href,
        referrer: document.referrer,
        title: document.title,
        userAgent: navigator.userAgent,
        language: navigator.language,
        screenResolution: `${window.screen.width}x${window.screen.height}`,
        viewportSize: `${window.innerWidth}x${window.innerHeight}`,
        deviceType: this.getDeviceType(),
        connectionType: this.getConnectionType(),
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        prefersColorScheme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light',
        prefersReducedMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches
      };

      this.saveToLocalStorage(pageView);
    }

    getDeviceType() {
      const ua = navigator.userAgent;
      if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua)) {
        return 'mobile';
      } else if (/Tablet|iPad/i.test(ua)) {
        return 'tablet';
      }
      return 'desktop';
    }

    getConnectionType() {
      const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      return connection ? connection.effectiveType : 'unknown';
    }

    setupEventListeners() {
      document.addEventListener('click', (event) => {
        if (Math.random() > ANALYTICS_CONFIG.eventSampleRate) return;

        const target = event.target;
        const clickData = {
          type: 'click',
          timestamp: Date.now(),
          sessionId: this.sessionId,
          pageViewId: this.pageViewId,
          url: window.location.href,
          target: {
            tag: target.tagName,
            id: target.id,
            className: target.className,
            text: target.textContent?.substring(0, 100) || '',
            href: target.href || ''
          },
          position: {
            x: event.clientX,
            y: event.clientY
          }
        };

        this.saveToLocalStorage(clickData);
      });

      let lastScrollReport = 0;
      window.addEventListener('scroll', () => {
        const now = Date.now();
        if (now - lastScrollReport < 1000) return;
        
        const scrollDepth = this.calculateScrollDepth();
        const scrollData = {
          type: 'scroll',
          timestamp: now,
          sessionId: this.sessionId,
          pageViewId: this.pageViewId,
          url: window.location.href,
          scrollY: window.scrollY,
          scrollDepth: scrollDepth,
          viewportHeight: window.innerHeight,
          documentHeight: document.documentElement.scrollHeight
        };

        this.saveToLocalStorage(scrollData);
        lastScrollReport = now;
      });

      this.setupMathInteractionTracking();
      this.setupSearchTracking();
      this.setupExternalLinkTracking();
    }

    calculateScrollDepth() {
      const scrollY = window.scrollY;
      const windowHeight = window.innerHeight;
      const documentHeight = document.documentElement.scrollHeight;
      
      const maxScroll = documentHeight - windowHeight;
      if (maxScroll <= 0) return 0;
      
      return Math.min(100, Math.round((scrollY / maxScroll) * 100));
    }

    setupMathInteractionTracking() {
      document.addEventListener('click', (event) => {
        const target = event.target;
        if (target.classList && (target.classList.contains('MathJax') || target.classList.contains('math'))) {
          const mathData = {
            type: 'math_interaction',
            timestamp: Date.now(),
            sessionId: this.sessionId,
            pageViewId: this.pageViewId,
            url: window.location.href,
            elementType: target.tagName,
            mathType: this.getMathType(target)
          };

          this.saveToLocalStorage(mathData);
        }
      });
    }

    getMathType(element) {
      const className = element.className || '';
      if (className.includes('display')) return 'display';
      if (className.includes('inline')) return 'inline';
      return 'unknown';
    }

    setupSearchTracking() {
      const searchInput = document.querySelector('input[type="search"], input[name="q"], .search-input');
      if (searchInput) {
        let searchStartTime = null;
        
        searchInput.addEventListener('focus', () => {
          searchStartTime = Date.now();
        });

        searchInput.addEventListener('blur', () => {
          if (searchStartTime && searchInput.value.trim()) {
            const searchData = {
              type: 'search',
              timestamp: Date.now(),
              sessionId: this.sessionId,
              pageViewId: this.pageViewId,
              url: window.location.href,
              query: searchInput.value,
              duration: Date.now() - searchStartTime
            };

            this.saveToLocalStorage(searchData);
          }
          searchStartTime = null;
        });
      }
    }

    setupExternalLinkTracking() {
      document.addEventListener('click', (event) => {
        let target = event.target;
        while (target && target.tagName !== 'A') {
          target = target.parentElement;
        }
        
        if (target && target.tagName === 'A' && target.href) {
          const url = new URL(target.href);
          const currentUrl = new URL(window.location.href);
          
          if (url.hostname !== currentUrl.hostname) {
            const linkData = {
              type: 'external_link',
              timestamp: Date.now(),
              sessionId: this.sessionId,
              pageViewId: this.pageViewId,
              url: window.location.href,
              externalUrl: target.href,
              linkText: target.textContent?.substring(0, 100) || '',
              isNewTab: target.target === '_blank'
            };

            this.saveToLocalStorage(linkData);
          }
        }
      });
    }

    setupPeriodicFlush() {
      setInterval(() => {
        const data = this.loadFromLocalStorage();
        if (data.length >= 20) this.flushData();
      }, 30000);

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') this.flushData();
      });
    }

    saveToLocalStorage(data) {
      try {
        const stored = localStorage.getItem(ANALYTICS_CONFIG.localStorageKey);
        const analyticsData = stored ? JSON.parse(stored) : [];
        analyticsData.push(data);
        
        if (analyticsData.length > 100) {
          analyticsData.splice(0, analyticsData.length - 100);
        }
        
        localStorage.setItem(ANALYTICS_CONFIG.localStorageKey, JSON.stringify(analyticsData));
      } catch (e) {
        console.warn('无法保存分析数据:', e.message);
      }
    }

    loadFromLocalStorage() {
      try {
        const stored = localStorage.getItem(ANALYTICS_CONFIG.localStorageKey);
        return stored ? JSON.parse(stored) : [];
      } catch (e) {
        return [];
      }
    }

    clearLocalStorage() {
      try {
        localStorage.removeItem(ANALYTICS_CONFIG.localStorageKey);
      } catch (e) {}
    }

    async flushData() {
      const data = this.loadFromLocalStorage();
      if (data.length === 0) return;

      try {
        if (navigator.sendBeacon) {
          const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
          navigator.sendBeacon(ANALYTICS_CONFIG.endpoint, blob);
        } else {
          await fetch(ANALYTICS_CONFIG.endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
            keepalive: true
          });
        }
        
        this.clearLocalStorage();
      } catch (error) {
        console.warn('发送分析数据失败:', error);
      }
    }

    trackEvent(eventName, properties = {}) {
      if (Math.random() > ANALYTICS_CONFIG.eventSampleRate) return;

      const eventData = {
        type: 'custom_event',
        timestamp: Date.now(),
        sessionId: this.sessionId,
        pageViewId: this.pageViewId,
        url: window.location.href,
        eventName: eventName,
        properties: properties
      };

      this.saveToLocalStorage(eventData);
    }

    trackError(error, context = {}) {
      const errorData = {
        type: 'error',
        timestamp: Date.now(),
        sessionId: this.sessionId,
        pageViewId: this.pageViewId,
        url: window.location.href,
        error: {
          message: error.message,
          stack: error.stack,
          name: error.name
        },
        context: context
      };

      this.saveToLocalStorage(errorData);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      window.analytics = new AnalyticsCollector();
    });
  } else {
    window.analytics = new AnalyticsCollector();
  }

})();
</script>
</body>
</html>
